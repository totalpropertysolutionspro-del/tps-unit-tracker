<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TPS Pro — Unit Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#09090f;--card:#111118;--card2:#18181f;--border:#ffffff0d;
  --gold:#f5c842;--green:#22c55e;--blue:#3b82f6;--red:#ef4444;
  --amber:#f59e0b;--purple:#a855f7;--teal:#14b8a6;
  --text:#f0f0f0;--dim:#666;--dimmer:#333;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;min-height:100vh;padding-bottom:80px}

/* ── HEADER ── */
.hdr{padding:54px 18px 16px;background:linear-gradient(180deg,#0c0c18,var(--bg))}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-start}
.hdr h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
.hdr h1 span{color:var(--gold)}
.hdr-date{font-size:12px;color:var(--dim);margin-top:3px}
.live-dot{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--green);font-weight:600}
.live-dot::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── EARNINGS CARDS ── */
.earn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 14px 0}
.earn-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;cursor:pointer;transition:border-color .2s}
.earn-card.active{border-color:var(--gold)}
.earn-label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.earn-num{font-size:28px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.earn-sub{font-size:11px;color:var(--dim);margin-top:4px}
.earn-full{margin:10px 14px 0;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;cursor:pointer;transition:border-color .2s}
.earn-full.active{border-color:var(--gold)}
.earn-full-inner{display:flex;justify-content:space-between;align-items:center}
.col-green{color:var(--green)}
.col-blue{color:var(--blue)}
.col-gold{color:var(--gold)}
.col-purple{color:var(--purple)}
.col-amber{color:var(--amber)}

/* ── TAB BAR ── */
.tabs{display:flex;gap:0;padding:16px 14px 0;border-bottom:1px solid var(--border);margin-bottom:2px}
.tab{flex:1;text-align:center;font-size:13px;font-weight:600;color:var(--dim);padding:10px 0;border-bottom:2px solid transparent;cursor:pointer;transition:all .2s}
.tab.on{color:var(--gold);border-bottom-color:var(--gold)}

/* ── CONTENT ── */
.pane{display:none;padding:14px}
.pane.on{display:block}

/* ── TODAY PANE ── */
.today-banner{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
.tb-row{display:flex;justify-content:space-between;align-items:center}
.tb-title{font-size:16px;font-weight:700}
.tb-earn{font-size:22px;font-weight:800;color:var(--green)}
.tb-sub{font-size:12px;color:var(--dim);margin-top:3px}
.no-units{text-align:center;padding:40px 20px;color:var(--dim)}
.no-big{font-size:40px;margin-bottom:10px}
.next-up{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:14px}
.next-label{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin-bottom:8px}
.next-row{display:flex;justify-content:space-between;align-items:center}
.next-date{font-size:17px;font-weight:700}
.next-earn{font-size:15px;font-weight:700;color:var(--amber)}
.next-units-list{margin-top:10px;display:flex;flex-direction:column;gap:5px}

.unit-row{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border-radius:11px;padding:11px 14px;margin-bottom:6px;border:1px solid var(--border)}
.unit-row.done{opacity:.7}
.ul{display:flex;align-items:center;gap:10px}
.uicon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.ic-coda{background:#3b82f618}
.ic-may{background:#f59e0b18}
.unum{font-size:14px;font-weight:700}
.utype{font-size:11px;color:var(--dim);margin-top:1px}
.ubldg{font-size:11px;color:var(--dim)}
.status-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:20px;padding:4px 10px}
.sp-done{background:#22c55e18;color:var(--green)}
.sp-today{background:#f59e0b18;color:var(--amber)}
.sp-upcoming{background:#3b82f618;color:var(--blue)}

/* ── HISTORY PANE ── */
.hist-month{margin-bottom:20px}
.month-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:0 2px}
.month-name{font-size:15px;font-weight:700}
.month-earn{font-size:14px;font-weight:700;color:var(--green)}
.job-day{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:8px;overflow:hidden}
.jd-header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer}
.jd-left{display:flex;align-items:center;gap:10px}
.jd-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.jd-date{font-size:14px;font-weight:700}
.jd-count{font-size:12px;color:var(--dim);margin-top:2px}
.jd-right{text-align:right}
.jd-earn{font-size:17px;font-weight:800}
.jd-chevron{font-size:12px;color:var(--dim);margin-left:6px;transition:transform .2s}
.jd-units{display:none;border-top:1px solid var(--border);padding:10px 14px}
.jd-units.open{display:block}

/* ── MONTH FILTER ── */
.month-filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;margin-bottom:4px}
.month-filters::-webkit-scrollbar{display:none}
.mf-btn{flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:7px 14px;font-size:12px;font-weight:600;color:var(--dim);cursor:pointer;white-space:nowrap}
.mf-btn.active{background:var(--gold);color:#000;border-color:var(--gold)}

/* ── BOTTOM NAV ── */
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;padding:8px 0 18px;z-index:100}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-size:10px;font-weight:600;color:var(--dim)}
.bn-item.on{color:var(--gold)}
.bn-icon{font-size:22px}

/* ── SUMMARY PANE ── */
.sum-section{margin-bottom:20px}
.sum-title{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin-bottom:10px;padding:0 2px}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
.sc-label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px}
.sc-num{font-size:26px;font-weight:800;letter-spacing:-1px}
.progress-bar{height:6px;background:var(--dimmer);border-radius:6px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;border-radius:6px;transition:width 1s ease}

@media(min-width:500px){.earn-row{grid-template-columns:1fr 1fr 1fr}}

/* ── FORM FIELDS (shared) ── */
.add-section-title{font-size:14px;font-weight:700;margin-bottom:14px;color:var(--text)}
.add-table-wrap{overflow-x:auto;margin-bottom:20px;background:var(--card);border:1px solid var(--border);border-radius:14px}
.add-form{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}
.add-form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.add-form-full{margin-bottom:10px}
.aff{display:flex;flex-direction:column;gap:5px}
.aff label{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim)}
.aff input,.aff select{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px;outline:none;width:100%;-webkit-appearance:none}
.aff input:focus,.aff select:focus{border-color:var(--gold)}
.add-btn{width:100%;background:var(--gold);color:#000;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;margin-top:4px;letter-spacing:-.3px;transition:opacity .15s}
.add-btn:active{opacity:.75}
.no-add{text-align:center;padding:32px 20px;color:var(--dim);font-size:13px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:16px}
@media(max-width:499px){.add-form-row{grid-template-columns:1fr}}

/* ── MANAGE UNITS TABLE ── */
.mu-table-wrap{overflow-x:auto;margin-bottom:16px;background:var(--card);border:1px solid var(--border);border-radius:14px}
.mu-table{width:100%;border-collapse:collapse;font-size:13px}
.mu-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);padding:11px 13px;border-bottom:1px solid var(--border);white-space:nowrap}
.mu-table td{padding:10px 13px;border-bottom:1px solid var(--border);vertical-align:middle}
.mu-table tbody tr:last-child td{border-bottom:none}
.mu-table tfoot td{border-top:1px solid var(--border);border-bottom:none;padding:12px 13px}
.dg-hdr td{background:#ffffff06;font-size:11px;font-weight:700;color:var(--dim);padding:7px 13px;border-bottom:1px solid var(--border);border-top:1px solid var(--border)}
.src-badge{display:inline-block;font-size:10px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap}
.src-sched{background:#3b82f618;color:var(--blue)}
.src-addon{background:#a855f718;color:var(--purple)}
.partial-badge{display:inline-block;font-size:9px;font-weight:800;border-radius:20px;padding:2px 7px;background:#f59e0b25;color:#f59e0b;border:1px solid #f59e0b50;letter-spacing:.4px;vertical-align:middle;margin-left:4px;white-space:nowrap}
.del-btn{background:none;border:none;color:var(--red);cursor:pointer;font-size:15px;padding:3px 7px;border-radius:6px;transition:background .15s;line-height:1}
.del-btn:hover{background:#ef444420}
.reset-link{text-align:center;padding:14px 0 4px;font-size:12px;color:var(--dim)}
.reset-link a{color:#ef444480;text-decoration:none;cursor:pointer;transition:color .2s}
.reset-link a:hover{color:var(--red)}
.mu-tab-header{font-size:16px;font-weight:800;margin-bottom:16px;color:var(--text)}
@media(max-width:499px){.col-source{display:none}}
</style>
</head>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-top">
    <div>
      <h1>TPS Pro <span>💎</span></h1>
      <div class="hdr-date" id="hdrDate"></div>
    </div>
    <div class="live-dot">LIVE</div>
  </div>
</div>

<!-- EARNINGS CARDS -->
<div class="earn-row">

    <div class="earn-sub" id="unitsToday">0 units</div>
  </div>
  <div class="earn-card" id="filterMonth" onclick="setFilter('month')">
    <div class="earn-label">This Month</div>
    <div class="earn-num col-blue" id="earnMonth">$0</div>
    <div class="earn-sub" id="unitsMonth">0 units</div>
  </div>
</div>
<div class="earn-full" id="filterAll" onclick="setFilter('all')">
  <div class="earn-full-inner">
    <div>
      <div class="earn-label">Total Earned — All Time</div>
      <div class="earn-num col-gold" id="earnAll">$0</div>
    </div>
    <div style="text-align:right">
      <div class="earn-label">Units Done</div>
      <div class="earn-num col-purple" id="unitsDone">0</div>
    </div>
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab on" onclick="showTab('today')">Today</div>
  <div class="tab" onclick="showTab('history')">History</div>
  <div class="tab" onclick="showTab('summary')">Summary</div>
  <div class="tab" onclick="showTab('units')">Units</div>
</div>

<!-- TODAY PANE -->
<div class="pane on" id="pane-today"></div>

<!-- HISTORY PANE -->
<div class="pane" id="pane-history"></div>

<!-- SUMMARY PANE -->
<div class="pane" id="pane-summary"></div>

<!-- MANAGE UNITS PANE -->
<div class="pane" id="pane-units"></div>

// ── LIVE SCHEDULE (localStorage-backed, writable) ────────────────────
let LIVE_SCHED = [];

function loadLiveSched() {
  try {
    const saved = localStorage.getItem('tps_sched_overrides');
    if (saved) {
      LIVE_SCHED = JSON.parse(saved);
    } else {
      // First load — deep-copy hardcoded SCHED into localStorage
      LIVE_SCHED = JSON.parse(JSON.stringify(SCHED));
      localStorage.setItem('tps_sched_overrides', JSON.stringify(LIVE_SCHED));
    }
  } catch(e) {
    LIVE_SCHED = JSON.parse(JSON.stringify(SCHED));
  }
}

function saveLiveSched() {
  try { localStorage.setItem('tps_sched_overrides', JSON.stringify(LIVE_SCHED)); } catch(e) {}
}

// ── MIGRATE: fix any stale localStorage entries ──────────────────────
function migrateSchedule() {
  let dirty = false;
  // Patch 218.A on 2026-05-15 from '1-BED' → 'PARTIAL' if saved before the fix
  const day515 = LIVE_SCHED.find(d => d.date === '2026-05-15');
  if (day515) {
    day515.units = day515.units.map(u => {
      if (u[0] === '218.A' && u[1] === '1-BED') { dirty = true; return ['218.A','PARTIAL','The Coda']; }
      return u;
    });
  }
  // Remove 407.A from ALL dates — unit was never completed, wiped from schedule entirely
  for (const day of LIVE_SCHED) {
    const before = day.units.length;
    day.units = day.units.filter(u => u[0] !== '407.A');
    if (day.units.length < before) dirty = true;
  }
  // Remove 501.A and 501.B from 2026-05-19 — Mayflower phantom entries, not on official schedule
  const day519 = LIVE_SCHED.find(d => d.date === '2026-05-19');
  if (day519) {
    const before = day519.units.length;
    day519.units = day519.units.filter(u => !(u[0] === '501.A' || u[0] === '501.B'));
    if (day519.units.length < before) dirty = true;
  }
  if (dirty) saveLiveSched();
}

function resetToOriginalSchedule() {
  if (!confirm('Reset to original schedule?\n\nAll manual deletions will be restored. Manually added units will remain in your Add-On log.')) return;
  localStorage.removeItem('tps_sched_overrides');
  loadLiveSched();
  renderAll();
}

// ── ADD UNIT ─────────────────────────────────────────────────────────
function addUnit() {
  const cleanDate = document.getElementById('af-date').value;
  const bldg      = document.getElementById('af-bldg').value;
  const unit      = document.getElementById('af-unit').value.trim();
  const type      = document.getElementById('af-type').value;
  const notes     = document.getElementById('af-notes').value.trim();
  if (!cleanDate || !unit) { alert('Fill in Clean Date and Unit # to continue.'); return; }

  // Add to ADDITIONAL_UNITS (source tracking)
  ADDITIONAL_UNITS.push({ dateAdded: todayStr(), cleanDate, building: bldg, unit, type, notes });
  saveAdditional();

  // Add to LIVE_SCHED so it shows everywhere
  const dayIdx = LIVE_SCHED.findIndex(d => d.date === cleanDate);
  if (dayIdx !== -1) {
    LIVE_SCHED[dayIdx].units.push([unit, type, bldg]);
  } else {
    LIVE_SCHED.push({ date: cleanDate, units: [[unit, type, bldg]] });
    LIVE_SCHED.sort((a, b) => a.date < b.date ? -1 : 1);
  }
  saveLiveSched();

  // Reset form fields
  document.getElementById('af-unit').value  = '';
  document.getElementById('af-notes').value = '';

  renderAll();
}

// ── DELETE UNIT ──────────────────────────────────────────────────────
function deleteUnit(dateStr, unitNum) {
  if (!confirm('Remove Unit ' + unitNum + ' from ' + fmtDate(dateStr) + '?')) return;

  // Remove from LIVE_SCHED
  const dayIdx = LIVE_SCHED.findIndex(d => d.date === dateStr);
  if (dayIdx !== -1) {
    LIVE_SCHED[dayIdx].units = LIVE_SCHED[dayIdx].units.filter(u => u[0] !== unitNum);
    if (LIVE_SCHED[dayIdx].units.length === 0) LIVE_SCHED.splice(dayIdx, 1);
    saveLiveSched();
  }

  // Also remove from ADDITIONAL_UNITS if it was an add-on
  const addIdx = ADDITIONAL_UNITS.findIndex(u => u.cleanDate === dateStr && u.unit === unitNum);
  if (addIdx !== -1) {
    ADDITIONAL_UNITS.splice(addIdx, 1);
    saveAdditional();
  }

  renderAll();
}

// ── PRICING ──────────────────────────────────────────────────────────
// PARTIAL = $85 | 1BR / Studio = $195 | 2BR = $220 | 3BR = $245 | 4BR (Mayflower) = $300
function unitPrice(type) {
  if (!type) return 195;
  if (type === 'PARTIAL') return 85;
  if (type.startsWith('4')) return 300;
  if (type.startsWith('3')) return 245;
  if (type.startsWith('2')) return 220;
  return 195; // 1-BED, 1-BED/1-BATH, STUDIO
}

// ── FORECAST ─────────────────────────────────────────────────────────
let forecastMode = 'week';

function setForecastMode(mode) {
  forecastMode = mode;
  renderSummary();
}

function computeForecast() {
  const t = todayStr();
  const upcoming = LIVE_SCHED.filter(d => d.date > t);
  const groups = {};
  for (const day of upcoming) {
    let key, label;
    if (forecastMode === 'day') {
      key = day.date;
      const dt = new Date(day.date + 'T12:00:00');
      label = dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
    } else if (forecastMode === 'week') {
      const dt = new Date(day.date + 'T12:00:00');
      const dow = (dt.getDay() + 6) % 7;
      const mon = new Date(dt); mon.setDate(dt.getDate() - dow);
      key = mon.toISOString().split('T')[0];
      const ml = mon.toLocaleDateString('en-US',{month:'short',day:'numeric'});
      label = 'Week of ' + ml;
    } else {
      key = day.date.slice(0,7);
      label = new Date(key+'-15').toLocaleDateString('en-US',{month:'long',year:'numeric'});
    }
    if (!groups[key]) groups[key] = {label, coda:0, codaU:0, codaBeds:0, may:0, mayU:0, mayBeds:0};
    for (const [,type,bldg] of day.units) {
      const p = unitPrice(type);
      const b = bedCount(type);
      if (bldg === 'The Coda') { groups[key].coda += p; groups[key].codaU++; groups[key].codaBeds += b; }
      else { groups[key].may += p; groups[key].mayU++; groups[key].mayBeds += b; }
    }
  }
  return groups;
}

// ── HELPERS ──────────────────────────────────────────────────────────
const todayStr = () => new Date().toISOString().split('T')[0];
const monthStr = () => todayStr().slice(0,7);

function dayStatus(d) {
  const t = todayStr();
  if (d < t) return 'done';
  if (d === t) return 'today';
  return 'upcoming';
}

function fmtDate(d) {
  const dt = new Date(d + 'T12:00:00');
  return dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}

function fmtMoney(n) { return '$' + n.toLocaleString(); }

function typeShort(t) {
  if (!t) return '';
  if (t === 'STUDIO') return 'STU';
  if (t === 'PARTIAL') return 'PART';
  const m = t.match(/^(\d)-BED/);
  return m ? m[1]+'B' : t.split('/')[0];
}

function bedCount(type) {
  if (!type) return 1;
  const m = type.match(/^(\d)/);
  return m ? parseInt(m[1]) : 1;
}

// ── EARNINGS COMPUTE (uses LIVE_SCHED) ───────────────────────────────
function computeEarnings(filter) {
  const t = todayStr(), m = monthStr();
  let earn = 0, count = 0;
  for (const day of LIVE_SCHED) {
    const st = dayStatus(day.date);
    if (st === 'upcoming') continue;
    if (filter === 'today' && day.date !== t) continue;
    if (filter === 'month' && !day.date.startsWith(m)) continue;
    earn += day.units.reduce((s, u) => s + unitPrice(u[1]), 0);
    count += day.units.length;
  }
  return {earn, count};
}

function totalUnitsScheduled() {
  return LIVE_SCHED.reduce((a,d) => a + d.units.length, 0);
}

// ── RENDER EARNINGS ──────────────────────────────────────────────────
function renderEarnings() {
  const {earn:et, count:ct} = computeEarnings('today');
  const {earn:em, count:cm} = computeEarnings('month');
  const {earn:ea, count:ca} = computeEarnings('all');
  document.getElementById('earnToday').textContent  = fmtMoney(et);
  document.getElementById('unitsToday').textContent = ct + ' unit' + (ct!==1?'s':'') + ' completed';
  document.getElementById('earnMonth').textContent  = fmtMoney(em);
  document.getElementById('unitsMonth').textContent = cm + ' unit' + (cm!==1?'s':'') + ' this month';
  document.getElementById('earnAll').textContent    = fmtMoney(ea);
  document.getElementById('unitsDone').textContent  = ca;
}

        </div>
        <div class="jd-units" id="${id}">
          ${day.units.map(([u,type,bldg]) => `
          <div class="unit-row">
            <div class="ul">
              <div class="uicon ${bldg==='The Coda'?'ic-coda':'ic-may'}">${bldg==='The Coda'?'🏙':'🏠'}</div>
              <div><div class="unum">Unit ${u}</div><div class="utype">${type} · ${bldg}</div></div>
            </div>
            <div style="text-align:right">
              <div style="font-size:14px;font-weight:700;color:var(--green)">${fmtMoney(unitPrice(type))}</div>
              <div style="font-size:10px;color:var(--dim)">${typeShort(type)}</div>
            </div>
          </div>`).join('')}
          <div style="text-align:right;padding:8px 2px 4px;font-size:13px;font-weight:700;color:var(--green)">Day Total: ${fmtMoney(earn)}</div>
        </div>
      </div>`;
    }
    html += '</div>';
  }
  pane.innerHTML = html;
}

function toggleDay(id) {
  const el   = document.getElementById(id);
  const chev = document.getElementById('chev_' + id);
  el.classList.toggle('open');
  chev.style.transform = el.classList.contains('open') ? 'rotate(180deg)' : '';
}

// ── SUMMARY PANE (uses LIVE_SCHED) ───────────────────────────────────
function renderSummary() {
  const pane = document.getElementById('pane-summary');
  const totalSched = totalUnitsScheduled();
  const {earn:ea, count:ca} = computeEarnings('all');
  const remaining      = totalSched - ca;
  const projectedTotal = LIVE_SCHED.reduce((a,d) => a + d.units.reduce((s,u)=>s+unitPrice(u[1]),0), 0);
  const pct = totalSched > 0 ? Math.round((ca / totalSched) * 100) : 0;

  // By building + partials
  let codaDone = 0, mayDone = 0, codaTotal = 0, mayTotal = 0;
  let partialsDone = 0, partialsTotal = 0;
  const t = todayStr();
  for (const day of LIVE_SCHED) {
    const done = day.date <= t;
    for (const [,type,bldg] of day.units) {
      if (type === 'PARTIAL') { partialsTotal++; if(done) partialsDone++; }
      if (bldg === 'The Coda') { codaTotal++; if(done) codaDone++; }
      else { mayTotal++; if(done) mayDone++; }
    }
  }

  // Monthly breakdown (completed only)
  const byMonth = {};
  for (const day of LIVE_SCHED) {
    if (day.date > t) continue;
    const mk = day.date.slice(0,7);
    if (!byMonth[mk]) byMonth[mk] = {earn:0, count:0};
    byMonth[mk].earn  += day.units.reduce((s, u) => s + unitPrice(u[1]), 0);
    byMonth[mk].count += day.units.length;
  }

  // Forecast section
  const fGroups = computeForecast();
  const fKeys   = Object.keys(fGroups).sort();
  const btnBase = 'border:none;border-radius:20px;padding:7px 16px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;';
  const btnOn   = btnBase + 'background:var(--gold);color:#000;';
  const btnOff  = btnBase + 'background:var(--card2);color:var(--dim);';

  let fHtml = '';
  if (!fKeys.length) {
    fHtml = '<div style="color:var(--dim);text-align:center;padding:16px;font-size:13px">No upcoming jobs scheduled</div>';
  } else {
    for (const k of fKeys) {
      const g = fGroups[k];
      const total = g.coda + g.may;
      fHtml += `<div style="background:var(--card2);border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid var(--border)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div style="font-size:13px;font-weight:700">${g.label}</div>
          <div style="font-size:18px;font-weight:800;color:var(--gold)">${fmtMoney(total)}</div>
        </div>
        ${g.coda > 0 ? `<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;background:var(--card);border-radius:9px;padding:9px 12px">
          <span style="color:var(--blue)">🏙 The Coda &nbsp;·&nbsp; ${g.codaU} unit${g.codaU!==1?'s':''} &nbsp;·&nbsp; ${g.codaBeds} bed${g.codaBeds!==1?'s':''}</span>
          <span style="color:var(--blue);font-weight:700">${fmtMoney(g.coda)}</span>
        </div>` : ''}
        ${g.may > 0 ? `<div style="display:flex;justify-content:space-between;font-size:12px;background:var(--card);border-radius:9px;padding:9px 12px">
          <span style="color:var(--amber)">🏠 Mayflower &nbsp;·&nbsp; ${g.mayU} unit${g.mayU!==1?'s':''} &nbsp;·&nbsp; ${g.mayBeds} bed${g.mayBeds!==1?'s':''}</span>
          <span style="color:var(--amber);font-weight:700">${fmtMoney(g.may)}</span>
        </div>` : ''}
      </div>`;
    }
  }

  let html = `
  <div class="sum-section">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div class="sum-title" style="margin:0">Forecast</div>
      <div style="display:flex;gap:6px">
        <button onclick="setForecastMode('day')" style="${forecastMode==='day'?btnOn:btnOff}">Day</button>
        <button onclick="setForecastMode('week')" style="${forecastMode==='week'?btnOn:btnOff}">Week</button>
        <button onclick="setForecastMode('month')" style="${forecastMode==='month'?btnOn:btnOff}">Month</button>
      </div>
    </div>
    ${fHtml}
  </div>

  <div class="sum-section">
    <div class="sum-title">Season Progress</div>
    <div class="sum-grid">
      <div class="sum-card"><div class="sc-label">Units Done</div><div class="sc-num col-green">${ca}</div></div>
      <div class="sum-card"><div class="sc-label">Units Left</div><div class="sc-num col-amber">${remaining}</div></div>
      <div class="sum-card"><div class="sc-label">Earned</div><div class="sc-num col-gold">${fmtMoney(ea)}</div></div>
      <div class="sum-card"><div class="sc-label">Season Total</div><div class="sc-num col-blue">${fmtMoney(projectedTotal)}</div></div>
    </div>
    <div style="margin-top:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <span style="font-size:13px;font-weight:600">Season Completion</span>
        <span style="font-size:13px;font-weight:700;color:var(--gold)">${pct}%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:var(--gold)"></div></div>
    </div>
  </div>

  <div class="sum-section">
    <div class="sum-title">By Building</div>
    <div class="sum-grid">
      <div class="sum-card">
        <div class="sc-label">The Coda</div>
        <div class="sc-num col-blue">${codaDone}<span style="font-size:14px;color:var(--dim)">/${codaTotal}</span></div>
        <div class="progress-bar" style="margin-top:8px"><div class="progress-fill" style="width:${codaTotal>0?Math.round(codaDone/codaTotal*100):0}%;background:var(--blue)"></div></div>
      </div>
      <div class="sum-card">
        <div class="sc-label">Mayflower</div>
        <div class="sc-num col-amber">${mayDone}<span style="font-size:14px;color:var(--dim)">/${mayTotal}</span></div>
        <div class="progress-bar" style="margin-top:8px"><div class="progress-fill" style="width:${mayTotal>0?Math.round(mayDone/mayTotal*100):0}%;background:var(--amber)"></div></div>
      </div>
    </div>
  </div>

  ${partialsTotal > 0 ? `<div class="sum-section">
    <div class="sum-title">Partial Cleans</div>
    <div class="job-day" style="margin-bottom:8px">
      <div class="jd-header" style="cursor:pointer" onclick="showTab('units')">
        <div class="jd-left">
          <div class="jd-dot" style="background:var(--amber)"></div>
          <div>
            <div class="jd-date">Partial Cleans <span class="partial-badge" style="font-size:10px">PARTIAL</span></div>
            <div class="jd-count" style="margin-top:3px">1BD/1BA only · $85 each · <span style="color:var(--blue)">tap to view →</span></div>
          </div>
        </div>
        <div class="jd-right">
          <div style="font-size:17px;font-weight:800;color:var(--amber)">${fmtMoney(partialsDone * 85)}</div>
          <div class="jd-count">${partialsDone} completed · ${partialsTotal - partialsDone} upcoming</div>
        </div>
      </div>
    </div>
  </div>` : ''}
`;

  if (Object.keys(byMonth).length > 0) {
    html += `<div class="sum-section"><div class="sum-title">Monthly Breakdown</div>`;
    for (const [mk, data] of Object.entries(byMonth).sort((a,b) => a[0]<b[0]?-1:1)) {
      const mName = new Date(mk+'-15').toLocaleDateString('en-US',{month:'long',year:'numeric'});
      html += `<div class="job-day" style="margin-bottom:8px">
        <div class="jd-header" style="cursor:default">
          <div class="jd-date">${mName}</div>
          <div class="jd-right">
            <div class="jd-earn col-green">${fmtMoney(data.earn)}</div>
            <div class="jd-count">${data.count} units</div>
          </div>
        </div>
      </div>`;
    }
    html += `</div>`;
  }

  // Add-Ons summary row (informational — amounts already in LIVE_SCHED totals)
  const addCount = ADDITIONAL_UNITS.length;
  if (addCount > 0) {
    html += `<div class="sum-section">
      <div class="sum-title">Add-On Units</div>
      <div class="job-day" style="margin-bottom:8px">
        <div class="jd-header" style="cursor:pointer" onclick="showTab('units')">
          <div class="jd-left">
            <div class="jd-dot" style="background:var(--purple)"></div>
            <div>
              <div class="jd-date">Manually Added Units</div>
              <div class="jd-count">${addCount} unit${addCount!==1?'s':''} logged · <span style="color:var(--blue)">tap to manage →</span></div>
            </div>
          </div>
          <div class="jd-right">
            <div class="jd-earn" style="color:var(--purple)">${fmtMoney(ADDITIONAL_UNITS.reduce((s,u)=>s+unitPrice(u.type),0))}</div>
          </div>
        </div>
      </div>
    </div>`;
  }

  pane.innerHTML = html;
}

// ── TABS ─────────────────────────────────────────────────────────────
function showTab(name) {
  const names = ['today','history','summary','units'];
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('on', names[i] === name);
  });
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('on'));
  document.getElementById('pane-'+name).classList.add('on');
}

function setFilter(f) {
  ['today','month','all'].forEach(k => {
    const el = document.getElementById('filter'+k.charAt(0).toUpperCase()+k.slice(1));
    if (el) el.classList.toggle('active', k === f);
  });
}

// ── RENDER ALL ───────────────────────────────────────────────────────
function renderAll() {
  renderEarnings();
  renderToday();
  renderHistory();
  renderSummary();
  renderManageUnits();
}

// ── DEDUPLICATION ────────────────────────────────────────────────────
function deduplicateSchedule() {
  // — Deduplicate tps_sched_overrides —
  try {
    const raw = localStorage.getItem('tps_sched_overrides');
    if (raw) {
      const sched = JSON.parse(raw);
      const seen = new Set();
      let removed = 0;
      // Sort dates ascending so we keep the earliest occurrence
      const sorted = [...sched].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
      for (const day of sorted) {
        const before = day.units.length;
        day.units = day.units.filter(([unit, , building]) => {
          const key = unit + '|' + building;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
        removed += before - day.units.length;
      }
      // Remove date entries that are now empty
      const cleaned = sorted.filter(day => day.units.length > 0);
      if (removed > 0) {
        localStorage.setItem('tps_sched_overrides', JSON.stringify(cleaned));
        console.log('Dedup removed ' + removed + ' entr' + (removed === 1 ? 'y' : 'ies') + ' from tps_sched_overrides');
      }
    }
  } catch(e) { console.warn('dedup sched error:', e); }

  // — Deduplicate tps_additional_units —
  try {
    const raw = localStorage.getItem('tps_additional_units');
    if (raw) {
      const units = JSON.parse(raw);
      const seen = new Set();
      let removed = 0;
      const cleaned = units.filter(u => {
        const key = u.unit + '|' + u.building;
        if (seen.has(key)) { removed++; return false; }
        seen.add(key);
        return true;
      });
      if (removed > 0) {
        localStorage.setItem('tps_additional_units', JSON.stringify(cleaned));
        console.log('Dedup removed ' + removed + ' entr' + (removed === 1 ? 'y' : 'ies') + ' from tps_additional_units');
      }
    }
  } catch(e) { console.warn('dedup additional error:', e); }
}

// ── INIT ─────────────────────────────────────────────────────────────
function init() {
  deduplicateSchedule();
  loadLiveSched();
  migrateSchedule();
  const now = new Date();
  document.getElementById('hdrDate').textContent = now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  renderAll();
}

init();
// Auto-refresh every 5 minutes
setInterval(init, 300000);
</script>
